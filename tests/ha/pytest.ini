; Scoped pytest config for the real-Home-Assistant suite (tests/ha only).
;
; It lives here rather than at the repo root on purpose: `pytest tests/ha` picks this file up
; as the inifile (rootdir = tests/ha), and the repo's other suites -- tests/protocol,
; tests/gallery, tests/hardware, tests/integration, tests/frontend -- keep running under
; plain unittest/pytest defaults, untouched by the HA-specific settings below.
[pytest]
; pytest-homeassistant-custom-component's fixtures are async and the HA core suite itself runs
; in auto mode; pytest-asyncio 1.x refuses to run them without this.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
norecursedirs = __pycache__ snapshots .venv-ha
