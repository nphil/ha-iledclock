          integration: iledclock

send_raw:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: iledclock
    opcode:
      required: true
      selector:
        number:
          min: 0
          max: 255
          step: 1
          mode: box
    payload_hex:
      default: ""
      selector:
        text:
    timeout_s:
      default: 5.0
      selector:
        number:
          min: 0.1
          max: 60
          step: 0.1
          mode: box
