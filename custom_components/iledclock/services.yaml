night_mode:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: iledclock
    enabled:
      required: true
      selector:
        boolean:
    start_hour:
      required: true
      selector:
        number:
          min: 0
          max: 23
          step: 1
          mode: box
    start_minute:
      required: true
      selector:
        number:
          min: 0
          max: 59
          step: 1
          mode: box
    end_hour:
      required: true
      selector:
        number:
          min: 0
          max: 23
          step: 1
          mode: box
    end_minute:
      required: true
      selector:
        number:
          min: 0
          max: 59
          step: 1
          mode: box
    device_off:
      default: false
      selector:
        boolean:
    brightness:
      default: 50
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: box
    wake_minutes:
      default: 5
      selector:
        number:
          min: 5
          max: 120
          step: 1
          mode: box
    voice:
      default: false
      selector:
        boolean:
    voice_sensitivity:
      default: 5
      selector:
        number:
          min: 1
          max: 10
          step: 1
          mode: box

reminder_delete:
