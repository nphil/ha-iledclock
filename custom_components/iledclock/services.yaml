show_text:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: iledclock
    text:
      required: true
      selector:
        text:
    color_mode:
      default: 1
      selector:
        number:
          min: 1
          max: 28
          step: 1
          mode: box
    speed:
      default: 230
      selector:
        number:
          min: 0
          max: 255
          step: 1
          mode: box
    font:
      selector:
        text:
    is_bold:
      default: true
      selector:
        boolean:
    duration_s:
      selector:
        number:
          min: 1
          max: 3600
          step: 1
          mode: box

show_design:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: iledclock
    design_id:
      required: true
      selector:
        text:

show_image:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: iledclock
    url:
      selector:
        text:
    data_b64:
      selector:
        text:
          multiline: true
    fit:
      default: contain
      selector:
        select:
          options:
            - contain
            - cover
            - stretch
    dither:
      default: true
      selector:
        boolean:

show_generative:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: iledclock
    kind:
      required: true
      selector:
        select:
          options:
            - life
            - fire
            - plasma
            - matrix
            - starfield
            - rainbow
            - sparkle
    seconds:
      default: 10
      selector:
        number:
          min: 1
          max: 300
          step: 1
          mode: box
    seed:
      selector:
        number:
          mode: box

set_playlist:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: iledclock
    playlist:
      required: true
      selector:
        object:

clock_face:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: iledclock
    style:
      required: true
      selector:
        number:
          min: 1
          max: 41
          step: 1
          mode: box
    color:
      required: true
      selector:
        number:
          min: 0
          max: 7
          step: 1
          mode: box
    hours24:
      default: true
      selector:
        boolean:
    show_seconds:
      default: false
      selector:
        boolean:

