name: HA compatibility

on:
  push:
  pull_request:
  schedule:
    # Weekly. The beta leg fails here about a week before a breaking Home
    # Assistant release reaches the house.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: pytest (HA ${{ matrix.channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Home Assistant and its test harness
        run: |
          uv venv -p 3.14
          python3 -c "import json,glob; [print(r) for f in glob.glob('custom_components/*/manifest.json') for r in json.load(open(f)).get('requirements', [])]" > manifest-requirements.txt
          prerelease=""
          if [ "${{ matrix.channel }}" = "beta" ]; then prerelease="--prerelease=allow"; fi
          # Unpinned here so the two legs follow Home Assistant; requirements_test.txt is the pinned
          # set for a local run. The Divoom decoder libraries are the integration's own test deps.
          uv pip install $prerelease "pytest-homeassistant[bluetooth]" -r manifest-requirements.txt pycryptodome lzallright zstandard
          # The manifest depends on `frontend`, whose package Home Assistant pins per release.
          frontend="$(uv run --no-project python -c "import json, pathlib, homeassistant; print(json.loads((pathlib.Path(homeassistant.__file__).parent / 'components' / 'frontend' / 'manifest.json').read_text())['requirements'][0])")"
          uv pip install $prerelease "$frontend"
      - name: Home Assistant suite (tests/ha)
        run: uv run --no-project pytest tests/ha
      - name: Library suites (unittest)
        run: |
          for suite in protocol gallery hardware integration; do
            uv run --no-project python -m unittest discover -s "tests/$suite" -t .
          done
