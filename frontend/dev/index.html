<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <title>iLedClock frontend -- dev harness</title>
    <style>
      :root {
        --card-background-color: #1c1c1c;
        --primary-text-color: #e1e1e1;
        --secondary-text-color: #9b9b9b;
        --divider-color: rgba(255, 255, 255, 0.14);
        --primary-color: #03a9f4;
        --error-color: #ff8a80;
        --primary-background-color: #111111;
        --secondary-background-color: #2b2b2b;
        --ha-card-border-radius: 12px;
        --ha-card-box-shadow: none;
        --iledclock-accent: #22e1e8;
        --iledclock-accent-deep: #0fb8bf;
        --iledclock-ink-on-accent: #052426;
        --iledclock-touch-target: 48px;
        font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--primary-background-color);
        color: var(--primary-text-color);
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 24px;
        padding: 24px;
        box-sizing: border-box;
      }
      section {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      h2 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        color: var(--secondary-text-color);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      #card-container,
      #panel-container {
        box-sizing: border-box;
        max-width: 480px;
      }
      #panel-container {
        max-width: none;
      }
    </style>
  </head>
  <body>
    <section>
      <h2>iledclock-card</h2>
      <div id="card-container"></div>
    </section>
    <section>
      <h2>iledclock-studio-panel</h2>
      <div id="panel-container"></div>
    </section>
    <script type="module" src="./dist/app.js"></script>
  </body>
</html>
